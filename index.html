<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1" />
<meta name="theme-color" content="#0f1115" />
<title>SelfDev</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg:#0f1115; --card:#1a1d24; --card-2:#21252e; --text:#eaeef5;
  --muted:#8a92a6; --accent:#4f8cff; --success:#34d399; --danger:#ef4444;
  --radius:16px;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body {
  min-height:100%; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
body {
  display:flex; flex-direction:column;
  padding:16px 16px calc(96px + env(safe-area-inset-bottom));
  min-height:100vh; max-width:520px; margin:0 auto;
}
.topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px; }
.streak-badge {
  display:flex; align-items:center; gap:6px; background:var(--card);
  padding:8px 14px; border-radius:100px; font-weight:700; font-size:16px;
}
.streak-badge .fire { font-size:18px; }
.streak-badge.hot {
  background:linear-gradient(135deg,#ff6b35,#ff3860);
  box-shadow:0 0 20px rgba(255,107,53,.4);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.03);} }
.level-badge { display:flex; flex-direction:column; gap:4px; min-width:110px; }
.lv-row { display:flex; justify-content:space-between; font-size:13px; color:var(--muted); }
.lv-row b { color:var(--text); }
.xp-bar { height:6px; background:var(--card-2); border-radius:100px; overflow:hidden; }
#xpFill { height:100%; width:0%; background:linear-gradient(90deg,var(--accent),#8b5cf6); border-radius:100px; transition:width .4s ease; }
.page { display:none; }
.page.active { display:block; animation:fade .2s ease; }
@keyframes fade { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
h2 { font-size:22px; margin-bottom:12px; }
h3 { font-size:15px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; font-weight:600; }
.quote {
  background:var(--card); border-left:3px solid var(--accent); border-radius:12px;
  padding:12px 16px; color:var(--muted); font-size:14px; line-height:1.5;
  font-style:italic; margin-bottom:20px;
}
.section { margin-bottom:24px; }
.section-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.counter { background:var(--card); padding:4px 10px; border-radius:100px; font-size:12px; color:var(--muted); }
.add-row { display:flex; gap:8px; margin-bottom:10px; }
.add-row input, textarea {
  flex:1; width:100%; background:var(--card); border:1px solid transparent;
  color:var(--text); border-radius:12px; padding:12px 14px; font-size:16px;
  font-family:inherit; outline:none; transition:border-color .15s ease;
}
.add-row input:focus, textarea:focus { border-color:var(--accent); }
.add-row input::placeholder, textarea::placeholder { color:var(--muted); }
.add-row .add {
  width:46px; flex-shrink:0; background:var(--accent); color:#fff; border:none;
  border-radius:12px; font-size:22px; font-weight:600; cursor:pointer;
}
.add-row .add:active { transform:scale(.95); }
textarea { min-height:84px; resize:vertical; line-height:1.5; }
.task-list { list-style:none; display:flex; flex-direction:column; gap:8px; }
.task {
  display:flex; align-items:center; gap:12px; background:var(--card);
  padding:12px 14px; border-radius:12px; cursor:pointer; transition:background .15s ease;
}
.task:active { background:var(--card-2); }
.task.done { opacity:.55; }
.task.done .text { text-decoration:line-through; }
.task .check {
  width:22px; height:22px; flex-shrink:0; border-radius:6px;
  border:2px solid var(--muted); display:flex; align-items:center;
  justify-content:center; font-size:13px; font-weight:700; color:transparent;
  transition:all .15s ease;
}
.task.done .check { background:var(--success); border-color:var(--success); color:#fff; }
.task .text { flex:1; font-size:15px; line-height:1.4; word-break:break-word; }
.task .del {
  background:none; border:none; color:var(--muted); font-size:22px;
  line-height:1; width:28px; height:28px; border-radius:8px; cursor:pointer;
}
.task .del:active { background:rgba(239,68,68,.15); color:var(--danger); }
.empty { text-align:center; color:var(--muted); font-size:14px; padding:20px 0; }
.week-strip { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:24px; }
.week-day {
  background:var(--card); border-radius:12px; padding:10px 4px;
  text-align:center; display:flex; flex-direction:column; align-items:center; gap:4px;
}
.week-day.today { outline:2px solid var(--accent); outline-offset:-2px; }
.week-day.productive { background:rgba(52,211,153,.15); }
.wd-name { font-size:11px; color:var(--muted); text-transform:uppercase; }
.wd-date { font-size:16px; font-weight:600; }
.wd-dot { width:6px; height:6px; border-radius:50%; background:var(--card-2); }
.week-day.productive .wd-dot { background:var(--success); }
.stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:24px; }
.stat-card {
  background:var(--card); padding:16px; border-radius:var(--radius);
  display:flex; flex-direction:column; gap:6px;
}
.stat-num { font-size:26px; font-weight:700; }
.stat-lbl { font-size:13px; color:var(--muted); }
.danger {
  width:100%; background:rgba(239,68,68,.1); color:var(--danger);
  border:1px solid rgba(239,68,68,.3); border-radius:var(--radius);
  padding:14px; font-size:15px; font-weight:600; cursor:pointer;
}
.danger:active { background:rgba(239,68,68,.2); }
.tabbar {
  position:fixed; bottom:0; left:0; right:0; display:flex;
  background:rgba(20,22,28,.92); backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px); border-top:1px solid #1f232c;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  gap:4px; z-index:10; max-width:520px; margin:0 auto;
}
.tab {
  flex:1; background:none; border:none; color:var(--muted);
  font-size:13px; font-weight:500; padding:12px; border-radius:10px;
  cursor:pointer; font-family:inherit;
}
.tab.active { color:var(--text); background:var(--card); }
</style>
</head>
<body>

<header class="topbar">
  <div class="streak-badge" id="streakBadge">
    <span class="fire">🔥</span>
    <span id="streakNum">0</span>
  </div>
  <div class="level-badge">
    <div class="lv-row"><span>Ур.</span><b id="levelNum">1</b></div>
    <div class="xp-bar"><div id="xpFill"></div></div>
  </div>
</header>

<main>
  <section id="page-today" class="page active">
    <h2 id="todayTitle">Сегодня</h2>
    <div class="quote" id="quote">«...»</div>
    <div class="section">
      <div class="section-head">
        <h3>Задачи на день</h3>
        <span class="counter" id="todayCounter">0/0</span>
      </div>
      <div class="add-row">
        <input id="taskInput" placeholder="Новая задача..." maxlength="120" />
        <button id="addTaskBtn" class="add" type="button">+</button>
      </div>
      <ul id="taskList" class="task-list"></ul>
    </div>
    <div class="section">
      <h3>Заметка дня</h3>
      <textarea id="dayNote" placeholder="Что сегодня было главным?"></textarea>
    </div>
  </section>

  <section id="page-week" class="page">
    <h2>Неделя</h2>
    <div class="week-strip" id="weekStrip"></div>
    <div class="section">
      <div class="section-head"><h3>Цели на неделю</h3></div>
      <div class="add-row">
        <input id="weekInput" placeholder="Цель на неделю..." maxlength="120" />
        <button id="addWeekBtn" class="add" type="button">+</button>
      </div>
      <ul id="weekList" class="task-list"></ul>
    </div>
  </section>

  <section id="page-profile" class="page">
    <h2>Профиль</h2>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-num" id="statStreak">0</div><div class="stat-lbl">🔥 Серия</div></div>
      <div class="stat-card"><div class="stat-num" id="statBest">0</div><div class="stat-lbl">🏆 Рекорд</div></div>
      <div class="stat-card"><div class="stat-num" id="statTotalDays">0</div><div class="stat-lbl">📅 Дней</div></div>
      <div class="stat-card"><div class="stat-num" id="statTasks">0</div><div class="stat-lbl">✅ Задач</div></div>
    </div>
    <div class="section">
      <h3>Опасная зона</h3>
      <button class="danger" id="resetBtn" type="button">Сбросить весь прогресс</button>
    </div>
  </section>
</main>

<nav class="tabbar">
  <button data-page="today" class="tab active" type="button">Сегодня</button>
  <button data-page="week" class="tab" type="button">Неделя</button>
  <button data-page="profile" class="tab" type="button">Профиль</button>
</nav>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
tg?.setHeaderColor?.('#0f1115'); tg?.setBackgroundColor?.('#0f1115');

const STORAGE_KEY = 'selfdev_v1';
const XP_PER_TASK = 10;
const XP_PER_LEVEL = 100;
const QUOTES = [
  'Маленькие шаги каждый день создают большие перемены.',
  'Дисциплина — мост между целями и результатами.',
  'Ты не обязан быть великим, чтобы начать. Начни, чтобы стать великим.',
  'Прогресс важнее совершенства.',
  '1% каждый день — это 37× за год.',
  'Лучший день, чтобы начать, — сегодня.',
  'Ты сильнее, чем думаешь.',
  'Не сравнивай себя с другими. Сравнивай с собой вчерашним.',
];

const pad = n => String(n).padStart(2,'0');
const dateKey = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey = () => dateKey(new Date());
const daysBetween = (a,b) => Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

function defaultState() {
  return {
    days: {},
    weekGoals: [],
    stats: { streak:0, bestStreak:0, lastProductiveDate:null,
             totalProductiveDays:0, totalTasksDone:0, xp:0 }
  };
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const p = JSON.parse(raw);
    const def = defaultState();
    return { days:p.days||{}, weekGoals:p.weekGoals||[],
             stats:{...def.stats, ...(p.stats||{})} };
  } catch { return defaultState(); }
}
let state = loadState();
const saveState = () => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {} };
function getDay(k) {
  if (!state.days[k]) state.days[k] = { tasks:[], note:'' };
  return state.days[k];
}
(function reconcile() {
  const last = state.stats.lastProductiveDate;
  if (last && daysBetween(last, todayKey()) > 1) {
    state.stats.streak = 0; saveState();
  }
})();

const getLevel = () => Math.floor(state.stats.xp / XP_PER_LEVEL) + 1;
const getXpInLevel = () => state.stats.xp % XP_PER_LEVEL;

function markProductive() {
  const t = todayKey();
  if (state.stats.lastProductiveDate === t) return;
  const last = state.stats.lastProductiveDate;
  state.stats.streak = (last && daysBetween(last, t) === 1) ? state.stats.streak + 1 : 1;
  state.stats.lastProductiveDate = t;
  state.stats.totalProductiveDays += 1;
  if (state.stats.streak > state.stats.bestStreak) state.stats.bestStreak = state.stats.streak;
}
const escapeHtml = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function addTask(text) {
  text = text.trim(); if (!text) return;
  getDay(todayKey()).tasks.push({ id:uid(), text, done:false });
  saveState(); render(); tg?.HapticFeedback?.impactOccurred('light');
}
function deleteTask(id) {
  const d = getDay(todayKey());
  d.tasks = d.tasks.filter(t => t.id !== id); saveState(); render();
}
function toggleTask(id) {
  const d = getDay(todayKey());
  const t = d.tasks.find(x => x.id === id); if (!t) return;
  t.done = !t.done;
  if (t.done) {
    state.stats.xp += XP_PER_TASK;
    state.stats.totalTasksDone += 1;
    markProductive();
    tg?.HapticFeedback?.notificationOccurred('success');
  }
  saveState(); render();
}
function addWeekGoal(text) {
  text = text.trim(); if (!text) return;
  state.weekGoals.push({ id:uid(), text, done:false });
  saveState(); render(); tg?.HapticFeedback?.impactOccurred('light');
}
function toggleWeekGoal(id) {
  const g = state.weekGoals.find(x => x.id === id); if (!g) return;
  g.done = !g.done; saveState(); render();
  tg?.HapticFeedback?.impactOccurred('light');
}
function deleteWeekGoal(id) {
  state.weekGoals = state.weekGoals.filter(g => g.id !== id); saveState(); render();
}
function setNote(text) { getDay(todayKey()).note = text; saveState(); }

function render() { renderHeader(); renderToday(); renderWeek(); renderProfile(); }

function renderHeader() {
  document.getElementById('streakNum').textContent = state.stats.streak;
  document.getElementById('levelNum').textContent = getLevel();
  document.getElementById('xpFill').style.width = (getXpInLevel()/XP_PER_LEVEL*100)+'%';
  document.getElementById('streakBadge').classList.toggle('hot', state.stats.streak >= 3);
}
function renderToday() {
  const q = QUOTES[Math.floor(Date.now()/86400000) % QUOTES.length];
  document.getElementById('quote').textContent = `«${q}»`;
  document.getElementById('todayTitle').textContent =
    new Date().toLocaleDateString('ru-RU', { weekday:'long', day:'numeric', month:'long' });
  const day = getDay(todayKey());
  const list = document.getElementById('taskList');
  list.innerHTML = '';
  if (!day.tasks.length) {
    list.innerHTML = '<li class="empty">Пока нет задач. Добавь первую 👆</li>';
  } else {
    day.tasks.forEach(t => {
      const li = document.createElement('li');
      li.className = 'task' + (t.done ? ' done' : '');
      li.innerHTML = `<div class="check">${t.done?'✓':''}</div>
        <span class="text">${escapeHtml(t.text)}</span>
        <button class="del" type="button">×</button>`;
      li.addEventListener('click', () => toggleTask(t.id));
      li.querySelector('.del').addEventListener('click', e => {
        e.stopPropagation(); deleteTask(t.id);
      });
      list.appendChild(li);
    });
  }
  document.getElementById('todayCounter').textContent =
    `${day.tasks.filter(t=>t.done).length}/${day.tasks.length}`;
  const note = document.getElementById('dayNote');
  if (document.activeElement !== note) note.value = day.note || '';
}
function getWeekDays() {
  const now = new Date();
  const dow = (now.getDay() + 6) % 7;
  const mon = new Date(now); mon.setDate(now.getDate() - dow);
  const arr = [];
  for (let i=0; i<7; i++) {
    const d = new Date(mon); d.setDate(mon.getDate() + i); arr.push(d);
  }
  return arr;
}
function renderWeek() {
  const strip = document.getElementById('weekStrip');
  strip.innerHTML = '';
  const days = getWeekDays();
  const names = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const tKey = todayKey();
  days.forEach((d,i) => {
    const key = dateKey(d);
    const dd = state.days[key];
    const prod = dd && dd.tasks.some(t => t.done);
    const el = document.createElement('div');
    el.className = 'week-day' + (key===tKey?' today':'') + (prod?' productive':'');
    el.innerHTML = `<div class="wd-name">${names[i]}</div>
      <div class="wd-date">${d.getDate()}</div>
      <div class="wd-dot"></div>`;
    strip.appendChild(el);
  });
  const list = document.getElementById('weekList');
  list.innerHTML = '';
  if (!state.weekGoals.length) {
    list.innerHTML = '<li class="empty">Целей на неделю пока нет</li>';
  } else {
    state.weekGoals.forEach(g => {
      const li = document.createElement('li');
      li.className = 'task' + (g.done ? ' done' : '');
      li.innerHTML = `<div class="check">${g.done?'✓':''}</div>
        <span class="text">${escapeHtml(g.text)}</span>
        <button class="del" type="button">×</button>`;
      li.addEventListener('click', () => toggleWeekGoal(g.id));
      li.querySelector('.del').addEventListener('click', e => {
        e.stopPropagation(); deleteWeekGoal(g.id);
      });
      list.appendChild(li);
    });
  }
}
function renderProfile() {
  document.getElementById('statStreak').textContent = state.stats.streak;
  document.getElementById('statBest').textContent = state.stats.bestStreak;
  document.getElementById('statTotalDays').textContent = state.stats.totalProductiveDays;
  document.getElementById('statTasks').textContent = state.stats.totalTasksDone;
}

document.getElementById('addTaskBtn').addEventListener('click', () => {
  const inp = document.getElementById('taskInput');
  addTask(inp.value); inp.value = '';
});
document.getElementById('taskInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { addTask(e.target.value); e.target.value = ''; }
});
document.getElementById('addWeekBtn').addEventListener('click', () => {
  const inp = document.getElementById('weekInput');
  addWeekGoal(inp.value); inp.value = '';
});
document.getElementById('weekInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { addWeekGoal(e.target.value); e.target.value = ''; }
});
document.getElementById('dayNote').addEventListener('input', e => setNote(e.target.value));
document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('Сбросить весь прогресс? Это необратимо.')) {
    state = defaultState(); saveState(); render();
  }
});
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('page-'+btn.dataset.page).classList.add('active');
    tg?.HapticFeedback?.impactOccurred('light');
  });
});

render();
</script>
</body>
</html>
