<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1" />
<meta name="theme-color" content="#05050A" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>Aura 7.0</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #05050A; --surface: rgba(255, 255, 255, 0.04); --surface-hover: rgba(255, 255, 255, 0.08);
  --border: rgba(255, 255, 255, 0.08); --text: #F2F4F8; --text-muted: #8A8D9D;
  --accent-1: #7C3AED; --accent-2: #3B82F6; --success: #10B981; --danger: #EF4444;
  --warning: #F59E0B; --radius: 20px; --nav-height: 76px; --water: #3B82F6;
}
[data-theme="emerald"] { --bg: #04120E; --accent-1: #10B981; --accent-2: #3B82F6; }
[data-theme="sunset"] { --bg: #120804; --accent-1: #F97316; --accent-2: #E11D48; }

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background-color: var(--bg);
  background-image: radial-gradient(circle at 15% 0%, rgba(124, 58, 237, 0.15) 0%, transparent 40%),
                    radial-gradient(circle at 85% 100%, rgba(59, 130, 246, 0.15) 0%, transparent 40%);
  background-attachment: fixed; color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding: 20px 20px calc(var(--nav-height) + 40px); min-height: 100vh; max-width: 520px; margin: 0 auto; overflow-x: hidden;
  transition: background-color 0.5s;
}
.hidden { display: none !important; }

/* --- Header & Clock --- */
.header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; padding-top: 10px; }
.time-widget { display: flex; flex-direction: column; }
.clock { font-size: 36px; font-weight: 800; letter-spacing: -1px; background: linear-gradient(135deg, #fff, var(--text-muted)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
.date-label { font-size: 13px; color: var(--text-muted); font-weight: 500; margin-top: 4px; text-transform: uppercase; }
.header-actions { display: flex; gap: 8px; align-items: center; }
.icon-btn { background: var(--surface); border: 1px solid var(--border); width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--text); cursor: pointer; }
.progress-ring { position: relative; width: 60px; height: 60px; }
.progress-ring svg { transform: rotate(-90deg); width: 60px; height: 60px; }
.progress-ring circle { fill: none; stroke-width: 5; stroke-linecap: round; }
.progress-ring .bg { stroke: var(--surface-hover); }
.progress-ring .fg { stroke: url(#gradient); stroke-dasharray: 157; stroke-dashoffset: 157; transition: stroke-dashoffset 0.6s; }
.progress-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 13px; font-weight: 700; }

/* --- Quote --- */
.quote-box { 
  padding: 16px 16px 16px 20px; margin-bottom: 20px; font-size: 14px; color: var(--text); 
  line-height: 1.5; background: var(--surface); border: 1px solid var(--border);
  border-left: 4px solid var(--accent-1); border-radius: var(--radius); font-style: italic;
}
.quote-author { display: block; margin-top: 8px; font-size: 12px; color: var(--accent-2); font-weight: 600; font-style: normal; text-align: right; }

/* --- Horizontal Dates --- */
.date-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: none; }
.date-scroll::-webkit-scrollbar { display: none; }
.date-chip { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; min-width: 64px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: background 0.3s, border-color 0.3s; }
.date-chip.active { background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); border-color: transparent; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4); }
.date-chip .d-name { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
.date-chip.active .d-name { color: rgba(255,255,255,0.9); }
.date-chip .d-num { font-size: 20px; font-weight: 800; }

/* --- Energy & Advice --- */
.energy-row { display: flex; gap: 8px; margin-bottom: 12px; }
.energy-btn { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 4px; color: var(--text-muted); font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: all 0.2s; cursor: pointer; }
.energy-btn .emoji { font-size: 20px; }
.energy-btn.active { background: var(--surface-hover); border-color: rgba(255,255,255,0.2); color: var(--text); transform: scale(0.95); }

.advice-box {
  background: var(--surface); border: 1px dashed var(--border); border-radius: 14px;
  padding: 14px; font-size: 13px; line-height: 1.4; margin-bottom: 20px;
  color: var(--text-muted); animation: slideDown 0.3s ease;
}
.advice-box b { color: var(--text); }
@keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

/* --- Water Tracker --- */
.water-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; margin-bottom: 20px; display: flex; align-items: center; gap: 16px;
}
.water-icon {
  width: 50px; height: 60px; background: rgba(59,130,246,0.1); border-radius: 10px;
  position: relative; overflow: hidden; border: 2px solid rgba(59,130,246,0.3);
  display: flex; align-items: flex-end; justify-content: center; flex-shrink: 0;
}
.water-fill {
  width: 100%; background: var(--water); height: 0%; transition: height 0.5s ease;
}
.water-info { flex: 1; }
.water-title { font-size: 14px; font-weight: 700; margin-bottom: 2px; display: flex; justify-content: space-between; align-items: center;}
.water-title span { font-size: 11px; color: var(--accent-1); cursor: pointer; text-decoration: underline;}
.water-val { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
.water-btns { display: flex; gap: 6px; }
.water-btn {
  background: rgba(59,130,246,0.15); color: var(--water); border: 1px solid rgba(59,130,246,0.3);
  border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 700; cursor: pointer;
  transition: all 0.2s;
}
.water-btn:active { background: var(--water); color: #fff; transform: scale(0.95); }

/* --- Quick Routines --- */
.routines-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: none; }
.routines-scroll::-webkit-scrollbar { display: none; }
.routine-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 100px; padding: 10px 16px; color: var(--text); font-size: 14px; font-weight: 500; white-space: nowrap; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.routine-btn:active { background: var(--surface-hover); transform: scale(0.95); }

/* --- Tasks --- */
.section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.section-head h2 { font-size: 18px; font-weight: 700; }
.task-list { display: flex; flex-direction: column; gap: 12px; }

.task-card {
  position: relative; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; display: flex; align-items: flex-start; gap: 14px;
  transition: opacity 0.3s; overflow: hidden;
}
.task-card.done { opacity: 0.5; }
.task-card.done .task-title { text-decoration: line-through; color: var(--text-muted); }

.task-inner {
  position: relative; z-index: 1; width: 100%; display: flex; align-items: flex-start; gap: 14px;
  background: transparent; touch-action: pan-y; transition: transform 0.2s;
}

.diff-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; flex-shrink: 0; }
.diff-1 { background: var(--success); box-shadow: 0 0 8px var(--success); }
.diff-2 { background: var(--warning); box-shadow: 0 0 8px var(--warning); }
.diff-3 { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

.low-energy .task-card[data-diff="3"] { opacity: 0.4; filter: grayscale(0.5); }

.task-check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; margin-top: 2px; }
.task-card.done .task-check { background: var(--success); border-color: var(--success); }
.task-check svg { width: 14px; height: 14px; stroke: #fff; stroke-width: 3; fill: none; opacity: 0; }
.task-card.done .task-check svg { opacity: 1; }
.task-content { flex: 1; }
.task-title { font-size: 16px; font-weight: 500; line-height: 1.4; margin-bottom: 6px; }
.task-time { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--text-muted); background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 8px; }
.task-card.is-now { border-color: rgba(16, 185, 129, 0.4); }
.task-card.is-now .task-time { color: var(--success); background: rgba(16, 185, 129, 0.15); }
.task-card.is-overdue .task-time { color: var(--danger); background: rgba(239, 68, 68, 0.15); }
.task-del { background: none; border: none; color: var(--text-muted); font-size: 24px; line-height: 1; padding: 0 4px; cursor: pointer; }

.empty { text-align: center; padding: 40px 20px; background: var(--surface); border-radius: var(--radius); border: 1px dashed var(--border); }
.empty .icon { font-size: 40px; margin-bottom: 12px; }
.empty h3 { font-size: 16px; margin-bottom: 6px; }
.empty p { font-size: 13px; color: var(--text-muted); }

/* --- Progress Screen --- */
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.stat-val { font-size: 28px; font-weight: 800; color: var(--accent-1); margin-bottom: 4px; }
.stat-lbl { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }

.chart-wrapper { width: 100%; height: 150px; margin-bottom: 24px; background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 10px; position: relative; }
.chart-svg { width: 100%; height: 100%; overflow: visible; }
.chart-line { fill: none; stroke: url(#gradient); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 4px 6px rgba(124,58,237,0.5)); }
.chart-area { fill: url(#areaGradient); opacity: 0.3; }
.chart-dot { fill: var(--accent-2); stroke: var(--text); stroke-width: 2; }

.badges-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.badge { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px 8px; text-align: center; opacity: 0.5; filter: grayscale(1); transition: all 0.3s; }
.badge.unlocked { opacity: 1; filter: grayscale(0); border-color: var(--accent-1); box-shadow: 0 0 15px rgba(124, 58, 237, 0.2); }
.badge-icon { font-size: 28px; margin-bottom: 8px; }
.badge-name { font-size: 11px; font-weight: 700; line-height: 1.2; }

/* --- Bottom Nav --- */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-height); background: rgba(5, 5, 10, 0.85); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; max-width: 520px; margin: 0 auto; padding-bottom: env(safe-area-inset-bottom); z-index: 90; }
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--text-muted); font-size: 11px; font-weight: 600; text-transform: uppercase; background: none; border: none; }
.nav-btn.active { color: var(--text); }
.nav-btn svg { width: 22px; height: 22px; fill: currentColor; }

/* --- FAB --- */
.fab { position: fixed; bottom: calc(var(--nav-height) + 20px); right: 20px; width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); color: #fff; border: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); z-index: 100; transition: transform 0.2s; }
.fab:active { transform: scale(0.9); }
.fab svg { width: 28px; height: 28px; stroke: #fff; stroke-width: 2.5; fill: none; }

/* --- Modals --- */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(6px); display: none; align-items: flex-end; z-index: 200; }
.modal-overlay.open { display: flex; }
.modal-content { background: #0F111A; width: 100%; border-radius: 28px 28px 0 0; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.input-group { margin-bottom: 16px; }
.input-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; }
input, textarea { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; color: var(--text); font-size: 16px; outline: none; font-family: inherit; }
input:focus, textarea:focus { border-color: var(--accent-1); }
.time-inputs { display: flex; gap: 12px; }
.time-inputs input { flex: 1; text-align: center; }
.modal-btns { display: flex; gap: 12px; margin-top: 24px; }
.btn { flex: 1; padding: 16px; border-radius: 14px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; }
.btn-cancel { background: var(--surface); color: var(--text); }
.btn-save { background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); color: #fff; }

/* Стили для выбора сложности */
.diff-selector { display: flex; gap: 8px; }
.diff-opt { flex: 1; padding: 12px 0; text-align: center; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text-muted); }
.diff-opt.active[data-val="1"] { border-color: var(--success); color: var(--success); background: rgba(16,185,129,0.1); }
.diff-opt.active[data-val="2"] { border-color: var(--warning); color: var(--warning); background: rgba(245,158,11,0.1); }
.diff-opt.active[data-val="3"] { border-color: var(--danger); color: var(--danger); background: rgba(239,68,68,0.1); }

/* --- Confetti --- */
.confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 999; }
</style>
</head>
<body>

<svg width="0" height="0"><defs>
  <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#7C3AED" /><stop offset="100%" stop-color="#3B82F6" />
  </linearGradient>
  <linearGradient id="areaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.8" /><stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
  </linearGradient>
</defs></svg>

<canvas id="confetti" class="confetti-canvas"></canvas>

<!-- ЭКРАН: ПЛАН -->
<div id="screen-plan">
  <header class="header">
    <div class="time-widget">
      <div class="clock" id="liveClock">00:00</div>
      <div class="date-label" id="dateLabel">Загрузка...</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="themeBtn" onclick="switchTheme()">🎨</button>
      <div class="progress-ring">
        <svg><circle class="bg" cx="30" cy="30" r="25"></circle><circle class="fg" cx="30" cy="30" r="25" id="ringProgress"></circle></svg>
        <div class="progress-text" id="ringText">0%</div>
      </div>
    </div>
  </header>

  <div class="quote-box" id="quoteBox">
    Текст цитаты...
    <span class="quote-author" id="quoteAuthor">— Автор</span>
  </div>

  <div class="date-scroll" id="dateScroll"></div>

  <!-- РЕСУРС -->
  <div class="energy-row">
    <button type="button" class="energy-btn" onclick="setEnergy('high')" id="btn-high">
      <span class="emoji">🔥</span>Заряд
    </button>
    <button type="button" class="energy-btn" onclick="setEnergy('mid')" id="btn-mid">
      <span class="emoji">😐</span>Норм
    </button>
    <button type="button" class="energy-btn" onclick="setEnergy('low')" id="btn-low">
      <span class="emoji">🪫</span>Без сил
    </button>
  </div>

  <div class="advice-box" id="adviceBox" style="display:none;"></div>

  <!-- ТРЕКЕР ВОДЫ -->
  <div class="water-card">
    <div class="water-icon"><div class="water-fill" id="waterFill"></div></div>
    <div class="water-info">
      <div class="water-title">Водный баланс <span onclick="openWaterModal()">⚙️</span></div>
      <div class="water-val" id="waterVal">0 / 2000 мл</div>
      <div class="water-btns">
        <button class="water-btn" onclick="addWater(250)">+250</button>
        <button class="water-btn" onclick="addWater(500)">+500</button>
        <button class="water-btn" onclick="addWater(1000)">+1000</button>
      </div>
    </div>
  </div>

  <!-- БЫСТРЫЕ РУТИНЫ -->
  <div class="routines-scroll">
    <button type="button" class="routine-btn" onclick="addQuickTask('💧 Выпить воды', 1)">💧 Вода</button>
    <button type="button" class="routine-btn" onclick="addQuickTask('📚 Чтение 20 мин', 1)">📚 Чтение</button>
    <button type="button" class="routine-btn" onclick="addQuickTask('🏋️ Тренировка', 3)">🏋️ Спорт</button>
    <button type="button" class="routine-btn" onclick="addQuickTask('🧘 Медитация', 1)">🧘 Медитация</button>
  </div>

  <div class="section-head">
    <h2>Твой таймлайн</h2>
    <span style="font-size:13px; color:var(--text-muted); font-weight:600;" id="taskCount">0 / 0</span>
  </div>

  <div id="taskContainer"></div>
</div>

<!-- ЭКРАН: ПРОГРЕСС -->
<div id="screen-progress" class="hidden">
  <header class="header" style="margin-bottom: 20px;">
    <div class="time-widget"><h1 style="font-size:32px; font-weight:800;">Прогресс</h1></div>
  </header>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-val" id="statStreak" style="color:var(--warning);">0</div>
      <div class="stat-lbl">🔥 Дней подряд</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="statTasks" style="color:var(--accent-1);">0</div>
      <div class="stat-lbl">✅ Всего задач</div>
    </div>
  </div>

  <h2 style="font-size:16px; margin-bottom:12px;">Динамика роста</h2>
  <div class="chart-wrapper">
    <svg class="chart-svg" id="growthChart" viewBox="0 0 300 120" preserveAspectRatio="none"></svg>
  </div>

  <h2 style="font-size:16px; margin-bottom:12px;">Достижения</h2>
  <div class="badges-grid" id="badgesGrid"></div>
</div>

<button class="fab" id="fabAdd" onclick="openAddModal()"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

<nav class="bottom-nav">
  <button class="nav-btn active" data-target="plan" onclick="switchTab('plan')">
    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>План
  </button>
  <button class="nav-btn" data-target="progress" onclick="switchTab('progress')">
    <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>Прогресс
  </button>
</nav>

<!-- МОДАЛКА ДОБАВЛЕНИЯ -->
<div class="modal-overlay" id="modalAdd">
  <div class="modal-content">
    <h3>Что в планах?</h3>
    <div class="input-group"><label>Задача</label><input type="text" id="taskInput" placeholder="Название..." autocomplete="off" /></div>
    
    <div class="input-group">
      <label>Сложность</label>
      <div class="diff-selector">
        <div class="diff-opt active" data-val="1" onclick="selectDiff(1)">🟢 Легко</div>
        <div class="diff-opt" data-val="2" onclick="selectDiff(2)">🟡 Средне</div>
        <div class="diff-opt" data-val="3" onclick="selectDiff(3)">🔴 Сложно</div>
      </div>
    </div>

    <div class="input-group"><label>Время (необязательно)</label><div class="time-inputs"><input type="time" id="timeStart" /><input type="time" id="timeEnd" /></div></div>
    <div class="modal-btns">
      <button class="btn btn-cancel" onclick="closeModal('modalAdd')">Отмена</button>
      <button class="btn btn-save" onclick="saveNewTask()">В план</button>
    </div>
  </div>
</div>

<!-- МОДАЛКА ВОДЫ -->
<div class="modal-overlay" id="modalWater">
  <div class="modal-content">
    <h3>Твоя норма воды</h3>
    <div class="input-group">
      <label>Сколько миллилитров в день?</label>
      <input type="number" id="waterTargetInput" placeholder="2000" step="100" />
    </div>
    <div class="modal-btns">
      <button class="btn btn-cancel" onclick="closeModal('modalWater')">Отмена</button>
      <button class="btn btn-save" onclick="saveWaterTarget()">Сохранить</button>
    </div>
  </div>
</div>

<script>
// Глобальный стейт
let state = {};
let activeDate = '';
let selectedDiff = 1;
const STORAGE_KEY = 'aura_mega_v7';

const pad = n => String(n).padStart(2, '0');
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey = () => dateKey(new Date());

const QUOTES = [
  { text: "Единственный способ делать великую работу — любить то, что ты делаешь.", author: "Стив Джобс" },
  { text: "Успех — это способность идти от неудачи к неудаче, не теряя энтузиазма.", author: "Уинстон Черчилль" },
  { text: "Ваше время ограничено, не тратьте его на чужую жизнь.", author: "Стив Джобс" },
  { text: "Лучший способ предсказать будущее — создать его.", author: "Питер Друкер" },
  { text: "Сложнее всего начать действовать, все остальное зависит только от упорства.", author: "Амелия Эрхарт" },
  { text: "Дисциплина — это выбор между тем, что хочешь сейчас, и тем, что хочешь больше всего.", author: "Абрахам Линкольн" }
];

const ADVICES = {
  high: "🔥 <b>Ты на пике!</b> Отличное время сделать самую сложную задачу. Твой мозг сейчас работает лучше всего.",
  mid: "😐 <b>Средний ресурс.</b> Хорошо подойдёт для обычных задач. Если устал — сделай перерыв на 15 минут.",
  low: "🪫 <b>На нуле...</b> Не геройствуй. Сложные задачи лучше перенести или сделать что-то совсем простое: уборка, вода, прогулка."
};

// === ИНИЦИАЛИЗАЦИЯ ===
window.onload = function() {
  const tg = window.Telegram?.WebApp;
  tg?.ready(); tg?.expand(); tg?.setHeaderColor?.('#05050A');

  try {
    state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
      days: {}, streak: 0, bestStreak: 0, lastStreakDate: null, theme: 'default', waterTarget: 2000
    };
  } catch(e) {
    state = { days: {}, streak: 0, bestStreak: 0, lastStreakDate: null, theme: 'default', waterTarget: 2000 };
  }
  
  activeDate = todayKey();
  
  if (state.theme && state.theme !== 'default') document.documentElement.setAttribute('data-theme', state.theme);

  updateClock();
  setInterval(updateClock, 1000);
  
  renderAll();
};

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function getDay(k) { 
  if (!state.days[k]) state.days[k] = { tasks: [], energy: '', water: 0 }; 
  if (state.days[k].water === undefined) state.days[k].water = 0;
  return state.days[k]; 
}

function updateClock() {
  const now = new Date();
  document.getElementById('liveClock').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const days = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб']; const months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  document.getElementById('dateLabel').textContent = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]}`;
}

function renderAll() {
  renderQuote();
  renderDates();
  renderEnergy();
  renderWater();
  renderTasks();
  renderStats();
}

function renderQuote() {
  const qIdx = Math.floor(new Date().setHours(0,0,0,0) / 86400000) % QUOTES.length;
  document.getElementById('quoteBox').innerHTML = `
    "${QUOTES[qIdx].text}"
    <span class="quote-author">— ${QUOTES[qIdx].author}</span>
  `;
}

function renderDates() {
  const scroll = document.getElementById('dateScroll'); scroll.innerHTML = '';
  const today = new Date();
  for (let i = -1; i <= 5; i++) {
    const d = new Date(today); d.setDate(today.getDate() + i);
    const key = dateKey(d);
    let name = ['ВС','ПН','ВТ','СР','ЧТ','ПТ','СБ'][d.getDay()];
    if (i === -1) name = 'Вчера'; if (i === 0) name = 'Сегодня'; if (i === 1) name = 'Завтра';
    const el = document.createElement('div');
    el.className = 'date-chip' + (key === activeDate ? ' active' : '');
    el.innerHTML = `<div class="d-name">${name}</div><div class="d-num">${d.getDate()}</div>`;
    el.onclick = () => { activeDate = key; renderAll(); };
    scroll.appendChild(el);
  }
}

// === ВОДА ===
function renderWater() {
  const day = getDay(activeDate);
  const target = state.waterTarget || 2000;
  document.getElementById('waterVal').textContent = `${day.water} / ${target} мл`;
  
  let pct = (day.water / target) * 100;
  if (pct > 100) pct = 100;
  document.getElementById('waterFill').style.height = pct + '%';
  
  if (pct >= 100) {
    document.getElementById('waterFill').style.background = 'var(--success)';
  } else {
    document.getElementById('waterFill').style.background = 'var(--water)';
  }
}

function addWater(ml) {
  const day = getDay(activeDate);
  const prev = day.water;
  day.water += ml;
  save();
  renderWater();
  
  if (prev < (state.waterTarget || 2000) && day.water >= (state.waterTarget || 2000)) {
    fireConfetti();
    if(window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
    setTimeout(() => alert('💧 Отлично! Норма воды на сегодня выполнена!'), 300);
  } else {
    if(window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
  }
}

function openWaterModal() {
  document.getElementById('waterTargetInput').value = state.waterTarget || 2000;
  document.getElementById('modalWater').classList.add('open');
}

function saveWaterTarget() {
  const val = parseInt(document.getElementById('waterTargetInput').value);
  if (val > 0) {
    state.waterTarget = val;
    save();
    renderWater();
    closeModal('modalWater');
  }
}

// === РЕСУРС И ЗАДАЧИ ===
function setEnergy(level) {
  const day = getDay(activeDate);
  day.energy = level;
  save();
  renderEnergy();
  if (window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
}

function renderEnergy() {
  const day = getDay(activeDate);
  document.getElementById('btn-high').classList.toggle('active', day.energy === 'high');
  document.getElementById('btn-mid').classList.toggle('active', day.energy === 'mid');
  document.getElementById('btn-low').classList.toggle('active', day.energy === 'low');
  
  const adviceBox = document.getElementById('adviceBox');
  if (day.energy && ADVICES[day.energy]) {
    adviceBox.innerHTML = ADVICES[day.energy];
    adviceBox.style.display = 'block';
    document.getElementById('screen-plan').classList.toggle('low-energy', day.energy === 'low');
  } else {
    adviceBox.style.display = 'none';
    document.getElementById('screen-plan').classList.remove('low-energy');
  }
}

function addQuickTask(text, diff) {
  getDay(activeDate).tasks.push({ id: Date.now().toString(), text, diff, timeStart: null, timeEnd: null, done: false });
  save(); renderTasks();
}

function renderTasks() {
  const day = getDay(activeDate);
  const container = document.getElementById('taskContainer');
  container.innerHTML = '';
  const doneCount = day.tasks.filter(t => t.done).length;
  document.getElementById('taskCount').textContent = `${doneCount} / ${day.tasks.length}`;

  const pct = day.tasks.length ? Math.round((doneCount / day.tasks.length) * 100) : 0;
  document.getElementById('ringText').textContent = pct + '%';
  document.getElementById('ringProgress').style.strokeDashoffset = 157 - (pct / 100) * 157;

  if (!day.tasks.length) {
    container.innerHTML = `<div class="empty"><div class="icon">🌌</div><h3>Здесь пока пусто</h3><p>Нажми на плюс или выбери рутину выше</p></div>`;
    return;
  }

  const sorted = [...day.tasks].sort((a, b) => (a.timeStart || '99:99').localeCompare(b.timeStart || '99:99'));
  const now = new Date(); const curTime = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const isToday = activeDate === todayKey();
  const list = document.createElement('div'); list.className = 'task-list';

  sorted.forEach(t => {
    const card = document.createElement('div');
    let diff = t.diff || 1;
    card.className = 'task-card' + (t.done ? ' done' : '');
    card.dataset.diff = diff;
    
    let timeHtml = '', statusClass = '';
    if (t.timeStart) {
      const timeStr = t.timeEnd ? `${t.timeStart} — ${t.timeEnd}` : `с ${t.timeStart}`;
      timeHtml = `<div class="task-time">🕒 ${timeStr}</div>`;
      if (isToday && !t.done) {
        if (t.timeEnd && curTime > t.timeEnd) statusClass = ' is-overdue';
        else if (curTime >= t.timeStart && (!t.timeEnd || curTime <= t.timeEnd)) statusClass = ' is-now';
      }
    }
    card.className += statusClass;

    card.innerHTML = `
      <div class="task-inner">
        <div class="diff-dot diff-${diff}"></div>
        <div class="task-check" onclick="toggleTask('${t.id}')"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div>
        <div class="task-content">
          <div class="task-title">${t.text}</div>
          ${timeHtml}
        </div>
        <button class="task-del" onclick="deleteTask('${t.id}')">×</button>
      </div>
    `;
    list.appendChild(card);
  });

  container.appendChild(list);
}

function toggleTask(id) {
  const day = getDay(activeDate);
  const t = day.tasks.find(x => x.id === id);
  if (!t) return;
  t.done = !t.done;
  if (t.done) {
    if (window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
    if (day.tasks.every(x => x.done)) fireConfetti();
  }
  save(); renderTasks();
}

function deleteTask(id) {
  const day = getDay(activeDate);
  day.tasks = day.tasks.filter(x => x.id !== id);
  save(); renderTasks();
}

// === ПРОГРЕСС ===
function renderStats() {
  // Стрик
  document.getElementById('statStreak').textContent = state.streak || 0;
  
  // Всего задач
  let total = 0;
  Object.values(state.days).forEach(d => total += d.tasks.filter(t => t.done).length);
  document.getElementById('statTasks').textContent = total;

  // График
  const svg = document.getElementById('growthChart');
  const today = new Date();
  const points = [];
  let maxVal = 1;

  for (let i = 6; i >= 0; i--) {
    const d = new Date(today); d.setDate(today.getDate() - i);
    const key = dateKey(d);
    const done = state.days[key] ? state.days[key].tasks.filter(t=>t.done).length : 0;
    if (done > maxVal) maxVal = done;
    points.push(done);
  }

  const width = 300, height = 120;
  const stepX = width / 6;
  
  let pathLine = '';
  let pathArea = '';

  points.forEach((val, i) => {
    const x = i * stepX;
    const y = height - (val / maxVal) * (height - 20) - 10;
    if (i === 0) {
      pathLine = `M ${x} ${y}`;
      pathArea = `M ${x} ${y}`;
    } else {
      pathLine += ` L ${x} ${y}`;
      pathArea += ` L ${x} ${y}`;
    }
  });
  
  pathArea += ` L ${width} ${height} L 0 ${height} Z`;

  svg.innerHTML = `
    <path class="chart-area" d="${pathArea}" />
    <path class="chart-line" d="${pathLine}" />
    ${points.map((val, i) => {
      const x = i * stepX;
      const y = height - (val / maxVal) * (height - 20) - 10;
      return `<circle class="chart-dot" cx="${x}" cy="${y}" r="4" />`;
    }).join('')}
  `;

  // Ачивки
  const BADGES = [
    { id: 'streak3', icon: '🔥', name: '3 дня подряд', unlocked: state.streak >= 3 },
    { id: 'streak7', icon: '🏆', name: 'Неделя силы', unlocked: state.streak >= 7 },
    { id: 'task10', icon: '✅', name: '10 задач', unlocked: total >= 10 },
    { id: 'task50', icon: '💎', name: '50 задач', unlocked: total >= 50 },
    { id: 'water', icon: '💧', name: 'Водный баланс', unlocked: Object.values(state.days).some(d => d.water >= (state.waterTarget || 2000)) },
    { id: 'early', icon: '🌅', name: 'Ранняя пташка', unlocked: Object.values(state.days).some(d => d.tasks.some(t => t.done && t.timeStart && t.timeStart < '08:00')) }
  ];

  const grid = document.getElementById('badgesGrid'); grid.innerHTML = '';
  BADGES.forEach(b => {
    grid.innerHTML += `<div class="badge ${b.unlocked ? 'unlocked' : ''}"><div class="badge-icon">${b.icon}</div><div class="badge-name">${b.name}</div></div>`;
  });
}

// === UI ===
function switchTheme() {
  const themes = ['default', 'emerald', 'sunset'];
  let idx = themes.indexOf(state.theme || 'default');
  state.theme = themes[(idx + 1) % themes.length];
  document.documentElement.setAttribute('data-theme', state.theme === 'default' ? '' : state.theme);
  save();
}

function switchTab(tab) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.nav-btn[data-target="${tab}"]`).classList.add('active');
  
  if (tab === 'progress') {
    document.getElementById('screen-plan').classList.add('hidden');
    document.getElementById('screen-progress').classList.remove('hidden');
    document.getElementById('fabAdd').classList.add('hidden');
    renderStats();
  } else {
    document.getElementById('screen-progress').classList.add('hidden');
    document.getElementById('screen-plan').classList.remove('hidden');
    document.getElementById('fabAdd').classList.remove('hidden');
  }
}

function openAddModal() {
  document.getElementById('taskInput').value = '';
  document.getElementById('timeStart').value = '';
  document.getElementById('timeEnd').value = '';
  selectDiff(1);
  document.getElementById('modalAdd').classList.add('open');
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function selectDiff(val) {
  selectedDiff = val;
  document.querySelectorAll('.diff-opt').forEach(o => o.classList.remove('active'));
  document.querySelector(`.diff-opt[data-val="${val}"]`).classList.add('active');
}

function saveNewTask() {
  const text = document.getElementById('taskInput').value.trim(); if (!text) return;
  getDay(activeDate).tasks.push({
    id: Date.now().toString(), text, diff: selectedDiff,
    timeStart: document.getElementById('timeStart').value || null,
    timeEnd: document.getElementById('timeEnd').value || null, done: false
  });
  save(); renderTasks(); closeModal('modalAdd');
}

// === КОНФЕТТИ ===
const canvas = document.getElementById('confetti'); const ctx = canvas.getContext('2d'); let particles = [];
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas); resizeCanvas();
function fireConfetti() {
  const colors = ['#7C3AED', '#3B82F6', '#10B981', '#F59E0B', '#EF4444'];
  for (let i = 0; i < 50; i++) {
    particles.push({ x: window.innerWidth / 2, y: window.innerHeight / 2, vx: (Math.random() - 0.5) * 15, vy: (Math.random() - 0.5) * 15 - 5, color: colors[Math.floor(Math.random() * colors.length)], size: Math.random() * 6 + 4, life: 1 });
  }
  if (particles.length === 50) requestAnimationFrame(updateConfetti);
}
function updateConfetti() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life -= 0.015;
    ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  });
  particles = particles.filter(p => p.life > 0);
  if (particles.length > 0) requestAnimationFrame(updateConfetti);
  else ctx.clearRect(0, 0, canvas.width, canvas.height);
}
